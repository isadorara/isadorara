<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="900" height="220" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="34" rx="12" fill="#161b22"/>
  <rect x="0" y="22" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="21" font-family="'Courier New', monospace" font-size="12" fill="#8b949e" text-anchor="middle">isadora@goiania: ~</text>

  <!-- terminal content -->
  <g font-family="'Courier New', monospace">
    <text x="30" y="70" font-size="16" fill="#58a6ff">
      <tspan fill="#7ee787">$</tspan> whoami
    </text>
    <text x="30" y="98" font-size="26" fill="#c9d1d9" font-weight="bold">Isadora Araújo</text>

    <text x="30" y="130" font-size="16" fill="#58a6ff">
      <tspan fill="#7ee787">$</tspan> cat about.txt
    </text>

    <text x="30" y="158" font-size="15" fill="#c9d1d9">
      <tspan fill="#e3b341">⋆</tspan> Goiânia, Brazil
      <tspan fill="#e3b341" dx="24">⋆</tspan> Computer Science
      <tspan fill="#e3b341" dx="24">⋆</tspan> Full Stack Development
    </text>

    <text x="30" y="190" font-size="16" fill="#58a6ff">
      <tspan fill="#7ee787">$</tspan> <tspan filter="url(#glow)" fill="#c9d1d9">_</tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
